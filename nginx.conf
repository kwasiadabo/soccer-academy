server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Proxied to the api container by service name — matches the "api" service
    # this image is expected to run alongside in docker-compose.
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing (React Router) — any unmatched path falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted build assets are safe to cache long-term; index.html must
    # always be revalidated so deploys are picked up immediately.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
